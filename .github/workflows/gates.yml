# The Playwright gates in tests/gates, on demand only.
#
# WHY THIS IS NOT PART OF CI
#
# These 44 specs launch the real built Electron app and measure real
# pagination, real PDF output and the real sandboxed render context. They are
# the most valuable tests in the repository and they are also, by measurement
# rather than by reputation, unreliable under host contention: repeated
# sequential `_electron.launch()` calls intermittently hang for 60s+ on a
# loaded machine, at a rate around 25-33%. That was confirmed by A/B against
# an unmodified build, which failed at the same rate -- it is environmental,
# not a product regression.
#
# GitHub-hosted runners are contended by definition. Making these a required
# check would produce a suite that is red for reasons unrelated to the change
# under review, and the only thing a permanently-red required check teaches a
# team is to stop reading CI.
#
# HOW TO READ A FAILURE HERE
#
#   Bare `Test timeout` + `Worker teardown timeout`, reaching no assertion
#     -> the environmental flake. Re-run the single spec in isolation.
#   A NAMED assertion failure ("Expected: 624, Received: 592")
#     -> a real regression. Take it seriously.
#
# That distinction has correctly resolved this question several times; do not
# collapse it into "the gates are flaky, ignore them".

name: Gates (real app)

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Only run specs whose title matches this (Playwright -g). Leave blank to run all 44.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  gates:
    name: real-app gates
    # macOS only. This is where the gates are developed and where their
    # measured baselines were taken; a Linux runner would additionally need a
    # virtual display, and would compare pixel measurements against numbers
    # that were never pinned on that platform.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pretest:gates` runs `pnpm build` for us, so the gates always drive
      # a freshly compiled app rather than a stale out/ directory.
      - name: Run gates
        env:
          FILTER: ${{ inputs.filter }}
        run: |
          set -euo pipefail
          if [ -n "$FILTER" ]; then
            pnpm test:gates -- -g "$FILTER"
          else
            pnpm test:gates
          fi

      # Traces and screenshots from a failed run are the only way to tell a
      # real regression from the launch flake after the fact.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
