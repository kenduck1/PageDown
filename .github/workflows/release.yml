# Packaged release builds.
#
# Push a tag like `v0.1.0` and this builds installers on all three native
# runners, then opens a DRAFT GitHub Release with them attached. Nothing
# becomes public until you review the draft and click publish.
#
# Deliberate choices worth knowing before editing:
#
#   * No third-party action touches the release or the token. Assets are
#     uploaded with the `gh` CLI, which is preinstalled on every runner, so
#     the entire publish path is code you can audit in this file.
#   * Builds are UNSIGNED. There is no Apple Developer ID or Windows
#     Authenticode certificate wired up, and `notarize: false` in
#     electron-builder.yml is itself already a blocker for macOS updates.
#     README.md documents the Gatekeeper and SmartScreen prompts users will
#     hit as a result. When certificates do exist, add them as secrets and
#     drop the CSC_IDENTITY_AUTO_DISCOVERY override in the macOS job.
#   * Linux targets are overridden to AppImage + deb on the command line.
#     electron-builder.yml also lists `snap`, which is right for a local
#     `pnpm build:linux` but needs snapcraft/LXD in CI and is a reliable way
#     to get red builds for no user-visible benefit.
#   * Tag-controlled values are passed through `env:` rather than
#     interpolated straight into `run:` bodies, so a tag name can never be
#     treated as shell syntax.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Catches the easy, expensive mistake: tagging v0.2.0 without bumping
      # package.json, which electron-builder would happily package as 0.1.0
      # and produce a release whose assets contradict its own name.
      - name: Compare tag against package.json version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${TAG_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag '${TAG_NAME}' implies version '${tag_version}' but package.json says '${pkg_version}'. Bump package.json, or retag."
            exit 1
          fi
          echo "Tag and package.json agree on ${pkg_version}."

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Never let one platform's failure cancel installers that already built
      # successfully -- a partial draft you can inspect beats no draft.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            artifact: macos
            # Both architectures in one invocation. electron-builder just
            # repackages the matching prebuilt Electron binary, so an arm64
            # runner cross-builds the x64 dmg fine.
            builder_args: --mac --arm64 --x64
          - os: windows-latest
            name: Windows
            artifact: windows
            builder_args: --win
          - os: ubuntu-latest
            name: Linux
            artifact: linux
            builder_args: --linux AppImage deb
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck -> electron-vite build -> pagination-render esbuild bundle.
      - name: Build application
        run: pnpm build

      # Signs and notarizes when the macOS certificate secrets are present, and
      # builds UNSIGNED when they are not -- deliberately, so this workflow
      # keeps working unchanged while an Apple Developer enrollment is pending
      # and starts signing the moment the secrets are added, with no edit here.
      #
      # Secrets required for signing (all five, macOS only):
      #   MAC_CERT_P12_BASE64   Developer ID Application cert exported as .p12,
      #                         base64-encoded
      #   MAC_CERT_PASSWORD     the password that .p12 was exported with
      #   APPLE_API_KEY_P8      contents of the App Store Connect .p8 key file
      #   APPLE_API_KEY_ID      that key's Key ID
      #   APPLE_API_ISSUER      the Issuer ID from App Store Connect
      #
      # NOTARIZATION USES AN APP STORE CONNECT API KEY rather than an Apple ID
      # plus app-specific password. Both are supported by electron-builder; the
      # API key is the better credential because it is a standalone identity
      # with its own ID, revocable on its own, rather than something derived
      # from the account that owns the enrollment. Create one at
      # appstoreconnect.apple.com -> Users and Access -> Integrations ->
      # App Store Connect API. The .p8 downloads exactly ONCE.
      #
      # Note what signing puts in the binary, since it is public: the
      # certificate's common name, i.e. `Developer ID Application: <NAME>
      # (<TEAMID>)`, readable by anyone via `codesign -dv --verbose=4`. For an
      # individual enrollment that NAME is a legal name. Enrolling as an
      # organization puts the company name there instead. Nothing else from the
      # Apple account is embedded.
      - name: Package installers
        env:
          BUILDER_ARGS: ${{ matrix.builder_args }}
          IS_MAC: ${{ matrix.os == 'macos-latest' }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          if [ "$IS_MAC" != "true" ] || [ -z "${CSC_LINK:-}" ] || [ -z "${APPLE_API_KEY_P8:-}" ]; then
            if [ "$IS_MAC" = "true" ]; then
              echo "::warning::No macOS signing secrets set -- building UNSIGNED."
              echo "::warning::Users will see 'PageDown is damaged'. See the README's Installing section."
            fi
            # Without this, electron-builder searches the keychain for an
            # identity and can fail confusingly rather than simply producing an
            # unsigned build.
            CSC_IDENTITY_AUTO_DISCOVERY=false \
              pnpm exec electron-builder $BUILDER_ARGS --publish never
            exit 0
          fi

          # electron-builder wants APPLE_API_KEY to be a PATH to the .p8, so
          # the secret has to become a file. Written under RUNNER_TEMP rather
          # than the workspace: a private key inside the checkout can be picked
          # up by a later packaging glob, and `rm` at the end of a `run:` block
          # never executes if the build fails. RUNNER_TEMP is outside the
          # workspace and is destroyed with the runner either way.
          KEY_PATH="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          trap 'rm -f "$KEY_PATH"' EXIT

          echo "Signing identity present -- signing and notarizing."
          echo "Notarization contacts Apple and can take several minutes."
          APPLE_API_KEY="$KEY_PATH" \
            pnpm exec electron-builder $BUILDER_ARGS --publish never -c.mac.notarize=true

      # Records, in the run summary, whether what just shipped is actually
      # signed -- read from the artifact rather than inferred from whether a
      # secret was set, because "the secret exists" and "the binary is signed"
      # are different claims and only the second one matters to a user.
      - name: Report signing status
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          app="$(find dist/mac* -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"
          if [ -z "$app" ]; then
            echo "No .app found to check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### macOS signing" >> "$GITHUB_STEP_SUMMARY"
          if codesign -dv --verbose=4 "$app" 2>&1 | grep -q "^Authority=Developer ID Application"; then
            codesign -dv --verbose=4 "$app" 2>&1 | grep "^Authority=Developer ID Application" \
              | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            echo "- Gatekeeper: $(spctl -a -vv "$app" 2>&1 | tail -1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **UNSIGNED** — users will see \"PageDown is damaged\" on first launch." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          # Installers AND the auto-update metadata. That second half is new,
          # and the comment that used to sit here said the opposite -- that
          # blockmaps "exist for auto-update, which this project does not
          # ship" -- which stopped being true the moment src/main/updater.ts
          # landed.
          #
          # What electron-updater actually reads, and why each is here:
          #
          #   * latest-mac.yml / latest.yml / latest-linux.yml -- THE FEED.
          #     electron-updater fetches the one for its own platform from the
          #     release and compares the version it names against the running
          #     app's. Without these attached to the release, there is nothing
          #     to check against and the updater does nothing, forever, with
          #     no error a user would ever see. This is the piece whose
          #     absence would look exactly like "the feature was never built".
          #   * *.blockmap -- DIFFERENTIAL DOWNLOAD. electron-updater uses it
          #     to fetch only the changed chunks of an installer instead of
          #     the whole thing. Not strictly required (it falls back to a
          #     full download), but it is the difference between a background
          #     update costing a few MB and costing ~100MB, which for a
          #     download that happens without asking is the whole point.
          #
          # The unpacked app directories stay excluded -- those really are
          # build intermediates.
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
          # A build that silently produced nothing must fail here rather than
          # yield an empty release.
          if-no-files-found: error
          retention-days: 7

  release:
    name: Open draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The only job in this workflow that can write to the repository.
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # Built with plain `echo` redirection rather than a heredoc on purpose:
      # a heredoc terminator has to sit at a fixed column, which fights YAML
      # block-scalar indentation and breaks in ways that only show up at run
      # time.
      - name: Compose release notes
        run: |
          set -euo pipefail
          {
            echo "> [!WARNING]"
            echo "> These builds are **unsigned** -- PageDown has no code-signing"
            echo "> certificate yet. macOS Gatekeeper and Windows SmartScreen will"
            echo "> warn on first launch. The README's *Installing* section has the"
            echo "> exact steps to get past each."
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| macOS (Apple Silicon) | \`*-arm64.dmg\` |"
            echo "| macOS (Intel) | \`*-x64.dmg\` |"
            echo "| Windows | \`*-setup.exe\` |"
            echo "| Linux | \`*.AppImage\` or \`*.deb\` |"
            echo ""
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed, and the README's *Installing* section for the unsigned-build steps."
          } > release-notes.md
          cat release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Assets to attach:"
          ls -lh installers/
          url="$(gh release create "$TAG_NAME" \
            --repo "$REPO" \
            --title "$TAG_NAME" \
            --draft \
            --notes-file release-notes.md \
            installers/*)"

          # Print the draft's real URL, and say plainly why it does not look
          # like the tag. GitHub parks every DRAFT at an `untagged-<hash>`
          # permalink and does not bind it to the tag until it is published --
          # so the Releases tab shows the tag's auto-generated "Source code"
          # zips next to a separate draft holding the actual installers. That
          # is confusing enough to have been reported as "the dmg is missing"
          # when all five assets were present and downloadable.
          {
            echo "### Draft release created"
            echo ""
            echo "$url"
            echo ""
            echo "The installers are attached to the DRAFT. Its URL says"
            echo "\`untagged-…\` because GitHub only binds a draft to its tag"
            echo "when you publish it — until then the Releases tab also shows"
            echo "the bare \`$TAG_NAME\` tag with only auto-generated source"
            echo "archives. Publishing the draft moves the installers onto the tag."
            echo ""
            echo "**In-app auto-update needs this draft PUBLISHED.** electron-updater"
            echo "reads the repository's latest-release API, which excludes drafts —"
            echo "so a draft is invisible to it no matter what is attached. The"
            echo "\`latest*.yml\` and \`.blockmap\` assets below are what it reads once"
            echo "the release is public; a release missing them updates nobody."
            echo "(And note the repository itself must be public: that API 404s for"
            echo "a private repo, and a token cannot ship inside the app.)"
            echo ""
            echo "Assets attached:"
            gh release view "$TAG_NAME" --repo "$REPO" \
              --json assets --jq '.assets[] | "- " + .name'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Draft: $url"
