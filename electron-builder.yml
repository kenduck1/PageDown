appId: com.pagedown.app
productName: PageDown
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# Product-completeness audit 2.5: file associations / "Open With". Paired
# with src/main/index.ts's own `open-file`/`process.argv`/`second-instance`
# handling and requestSingleInstanceLock() call -- see that file's own long
# comment (search "fourth isKnownPath source") for why an OS-delivered path
# is trusted, and for why single-instance-lock is required alongside this,
# not optional: without it, a SECOND double-click while the app is already
# running would spawn a whole duplicate app process on Windows/Linux rather
# than opening the file in the one already running.
fileAssociations:
  - ext: md
    name: Markdown Document
    description: PageDown document
    role: Editor
  - ext: markdown
    name: Markdown Document
    description: PageDown document
    role: Editor
win:
  executableName: pagedown
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # BOTH keys are required for a hardened-runtime build, and only
  # `entitlementsInherit` was set. That one applies to the helper processes
  # electron-builder signs on the app's behalf; `entitlements` applies to the
  # main executable itself. With it missing, the main binary is signed without
  # the JIT entitlements below, and Electron's own V8 fails to start under
  # hardened runtime -- an app that launches fine unsigned and crashes on
  # first run once signed, which is the worst possible time to find out.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Required for notarization; Apple rejects an un-hardened submission.
  hardenedRuntime: true
  # CI has no Gatekeeper assessment to make and the check needs a logged-in
  # session, so leaving it on makes signed builds fail on the runner only.
  gatekeeperAssess: false
  # A MAP, not a list -- and that is a real bug fix, not a style change.
  #
  # This was a YAML sequence (`- NSCameraUsageDescription: ...`), inherited
  # from the electron-vite scaffold. electron-builder merges `extendInfo` into
  # Info.plist verbatim, so a sequence produced a key literally named "0"
  # holding a nested dictionary:
  #
  #     "0" => { "NSDocumentsFolderUsageDescription" => "..." }
  #
  # Verified by inspecting a real built app with `plutil -p`. macOS looks for
  # these at the TOP level, so every usage description this project thought it
  # was declaring has been invisible to the OS in every build ever made. It
  # would have surfaced as a permission prompt with no explanatory text, or a
  # silent denial.
  #
  # Camera and microphone are set to null to REMOVE them. They are not ours --
  # Electron ships both in its own default Info.plist, so deleting our entries
  # left them in place (confirmed: they were still there after removal). This
  # app has no camera or microphone code path anywhere, and a usage string is
  # a declaration to the user that the app may ask. A document editor
  # advertising camera access is alarming to anyone who reads it and useless
  # to everyone else. Removing them also shrinks what a notarization or
  # store review has to account for.
  extendInfo:
    NSCameraUsageDescription: null
    NSMicrophoneUsageDescription: null
    NSDocumentsFolderUsageDescription: PageDown opens and saves your Markdown documents.
    NSDownloadsFolderUsageDescription: PageDown opens and saves documents in your Downloads folder.
  # DEFAULT-OFF, and overridden per run rather than flipped here.
  #
  # Notarization needs real Apple credentials. Leaving this true would break
  # every local `pnpm build:mac` and every CI run without secrets. The release
  # workflow passes `-c.mac.notarize=true` only when a signing identity is
  # actually present, so an unsigned build stays possible and a signed one
  # notarizes automatically. See .github/workflows/release.yml.
  notarize: false
dmg:
  # ${arch} is REQUIRED here, not cosmetic: the release workflow builds macOS
  # for arm64 and x64 in one electron-builder invocation, and without an arch
  # component both write to the same `pagedown-<version>.dmg` -- the second
  # silently overwrites the first, so the release would ship two assets'
  # worth of build time and one architecture's worth of installer.
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Kai Ko
  category: Utility
appImage:
  # Same collision risk as dmg above -- see that comment. The deb target
  # needs no equivalent: electron-builder's default deb artifact name
  # already carries the architecture.
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
# Product-completeness audit Tier 3: auto-update. `electron-updater` is not a
# dependency (checked package.json and the lockfile directly) and no real
# release host/code signing pipeline exists for this project yet -- shipping
# a `publish` block pointing anywhere, real or fake, would be actively
# misleading, because electron-builder bakes it straight into each
# platform's own update-manifest file (latest-mac.yml/latest.yml/
# latest-linux.yml) REGARDLESS of whether anything in the app ever reads it.
# The PREVIOUS value here (`https://example.com/auto-updates`, scaffold
# from the original electron-vite template, never touched since) is exactly
# that failure mode already realized: every build silently baked a bogus,
# unreachable URL into its own shipped update manifest.
#
# `publish: null` is the honest state -- electron-builder skips generating
# those manifest files entirely when no publish target is configured, so a
# shipped build no longer claims an update channel it doesn't have. This is
# a decision to defer, not an oversight: see docs/superpowers/plans/
# 2026-08-10-product-completeness-audit.md's Tier 3 entry and this task's
# own commit message for what a real auto-update integration would still
# need (a real release host reachable from end-user machines, real code
# signing/notarization on macOS -- `notarize: false` above is itself
# already a blocker, since Squirrel.Mac/electron-updater's macOS support
# requires a signed, notarized app to apply an update at all -- and a UI
# surface for "an update is available" / "restart to update"). Revisit
# this the moment any of those three actually exist; wiring electron-updater
# against a still-nonexistent release host would only trade one honest gap
# for a differently-shaped broken one.
publish: null
