<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PageDown Gate 3: Milkdown layout comparison (throwaway, not shipped)</title>
    <!--
    Task 6 / Gate 3: mirrors the pagination render context's OWN typography
    -- which, measured empirically against the real, already-Phase-0-
    validated harness (src/main/pagination-window.ts +
    resources/pagination-render/{index.html,index.ts}), turns out to be
    NONE. `previewer.preview(container, [], root)` -- the regular render
    path every corpus document goes through -- always passes an EMPTY
    stylesheet array (see index.ts's own extensive Gate 4 commentary on
    exactly this), so no @page rule, and no font-family/font-size/
    line-height rule of any kind, ever reaches Paged.js's Polisher for any
    document this app renders today. Content is laid out under plain
    Chromium UA defaults: getComputedStyle() against a real render of
    phase0/corpus/mixed.md reports font-family "Times", font-size "16px",
    line-height "normal" on <body> and every content element -- confirmed
    by actually running the harness (see gate3-layout-parity.spec.ts's own
    header comment for the full probe), not assumed from reading source
    alone.

    The one concrete, replicable value that context DOES establish is
    content width: 624px. That number is Paged.js's own hardcoded default
    page-box geometry (base.js: `@page { size: letter; margin: 0 }` is
    overridden by its `:root` custom-property defaults of
    `--pagedjs-width: 8.5in` / `--pagedjs-margin-*: 1in`, giving a content
    area of 8.5in - 1in - 1in = 6.5in = 624px @ 96dpi) -- NOT an
    app-authored design decision (this app has never passed Paged.js a
    stylesheet with an @page rule of its own). Replicated faithfully below;
    deliberately no font CSS is added here either, rather than inventing a
    typographic system the paginator itself doesn't have.

    Not part of the shipped app -- a throwaway comparison harness for this
    one gate. milkdown-compare.js is generated by gate3-layout-parity.spec.ts
    via esbuild at test-run time (gitignored, see fixtures/.gitignore) --
    run the spec once before opening this file directly in a browser.
  -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #content-root {
        width: 624px;
      }
    </style>
  </head>
  <body>
    <div id="content-root"></div>
    <script src="./milkdown-compare.js"></script>
  </body>
</html>
