<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <!--
    style-src uses a per-page-load random nonce, generated fresh on every
    navigation by the pagedown-render:// protocol handler
    (src/main/pagination-window.ts) and substituted into the
    %%CSP_STYLE_NONCE%% placeholders below (this file is served dynamically
    for exactly this reason, not as static bytes — see that handler's
    index.html special case). Task 6 first tried a blanket
    `style-src 'self' 'unsafe-inline'` here; a scoped nonce is a materially
    better fix and replaces it, for two reasons:

    1. Per CSP3, the mere PRESENCE of a nonce-source (or hash-source) in a
       directive causes browsers to ignore any `'unsafe-inline'` in that
       same directive entirely (kept only for backwards compatibility with
       browsers that don't understand nonces). Task 8 (Mermaid) is already
       expected, per the design doc, to need its own style nonce for
       sanitized SVG styles. If Task 8 had added a nonce on top of this
       file's previous blanket 'unsafe-inline', the 'unsafe-inline' would
       have silently stopped applying and Paged.js's own non-nonced
       injected styles would have gone right back to being blocked --
       reproducing the exact silent 10-second hang this task spent real
       effort diagnosing, just one task later and much harder to attribute.
       Doing the scoped nonce now means Task 8 composes with this cleanly
       instead of colliding with it.
    2. It's simply narrower: 'unsafe-inline' allows ANY inline style from
       ANY source (including attacker-controlled markup, if one ever
       reaches this page); a nonce only allows a <style> element that
       carries the exact per-load secret value. See index.ts's
       document.createElement shim for how Paged.js's own dynamically
       created <style> elements receive this nonce (they're the only thing
       that does -- see that file for why attacker-controlled <style> tags,
       which can only arrive via HTML parsing, never receive it).

    script-src deliberately still has NO 'unsafe-inline'/nonce -- that's the
    actual XSS-relevant vector (arbitrary script execution), and Gate 5's
    "CSP blocks inline script execution" regression test
    (phase0/gate5-sandbox.spec.ts) still passes unmodified. img-src 'self'
    data: and connect-src 'none' are also unchanged, so even an inline style
    that somehow did get through has no network path out for exfiltration.

    font-src data: was added by the Document Typography sub-project to
    allow a build-time-embedded, base64-encoded font (never user/document-
    controlled content) -- see resources/pagination-render/index.ts's
    typography-stylesheet construction for what actually uses it.

    The identical policy is ALSO sent as a real `Content-Security-Policy`
    response header by the protocol handler (`CSP_POLICY_TEMPLATE` in
    src/main/pagination-window.ts) -- a <meta http-equiv> tag only takes
    effect once the HTML parser reaches it, so anything processed before
    that point would otherwise run under no CSP at all. Keep both copies of
    this policy string in sync if either ever changes.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'nonce-%%CSP_STYLE_NONCE%%'; script-src 'self'; img-src 'self' data:; font-src data:; connect-src 'none';">
  <meta name="csp-style-nonce" content="%%CSP_STYLE_NONCE%%">
  <title>PageDown Pagination Render Context</title>
</head>
<body class="pagedown-document">
  <!--
    Document Typography sub-project: document-typography.css's every
    selector is scoped under `.pagedown-document` (see that file's own
    top comment) -- this class is this render context's half of that
    contract. Paged.js renders its generated pages inside #content-root,
    a direct child of <body>, so scoping here reaches every page it
    produces. The Milkdown mount div carries the same class on its side
    (src/renderer/src/milkdown/MilkdownEditor.tsx). Removing this class
    silently stops every rule in DOCUMENT_STYLESHEET (index.ts) from
    matching anything in this context -- no error, it just stops applying.
  -->
  <div id="content-root"></div>
  <script type="module" src="./index.js"></script>
</body>
</html>
