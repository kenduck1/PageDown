<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <!--
    style-src is 'self' only (no nonce): a hardcoded literal nonce shipped in
    the app provides no protection (attacker-controlled HTML can just
    include the same `nonce="..."` value and have it honored, since the
    "secret" is public). If a later task needs inline styles (e.g. Paged.js
    injecting computed page-break styles), generate a real per-load random
    nonce and inject both the CSP header value and matching `nonce="..."`
    attributes together, server-side, from the pagedown-render:// protocol
    handler — not as a fixed string checked into source.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none';">
  <title>PageDown Pagination Render Context</title>
</head>
<body>
  <div id="content-root"></div>
  <script type="module" src="./index.js"></script>
</body>
</html>
