<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <!--
    style-src includes 'unsafe-inline' (added in Task 6, confirmed necessary
    by actually running Paged.js against the previous 'self'-only policy —
    see docs/superpowers/plans/2026-07-25-phase0-findings.md's Gate 2 notes):
    Paged.js's Previewer creates <style> elements at runtime via
    document.createElement/appendChild to hold its computed per-document
    pagination CSS (page-break rules, page-box dimensions, etc.) — content
    that's necessarily unique per pagination run and can't be known ahead of
    time, so neither a static nonce (dynamically-created elements don't
    inherit a page-level nonce automatically; Paged.js's own code doesn't set
    `.nonce`/`nonce="..."` on the elements it creates, and we don't patch the
    library to do so) nor a content hash (the CSS content differs every run)
    can cover it. Under the previous 'self'-only policy, every one of these
    injected <style> elements was silently blocked (confirmed via captured
    CSP-violation console messages), which left `styleEl.sheet` null and
    made Paged.js's own code throw an uncaught, unawaited
    `TypeError: Cannot read properties of null (reading 'insertRule')` deep
    inside its layout internals — never rejecting the outer preview()
    promise, so callers hung until the harness's own 10s timeout rather than
    seeing a clean failure.
    script-src deliberately still has NO 'unsafe-inline'/nonce — that's the
    actual XSS-relevant vector (arbitrary script execution), and Gate 5's
    "CSP blocks inline script execution" regression test
    (phase0/gate5-sandbox.spec.ts) still passes unmodified against this
    change, confirming script execution is still blocked. Inline *style* is
    a materially different risk: with img-src still 'self' data: (no
    external image loads) and connect-src still 'none' (no fetch/XHR), a
    CSS-based data-exfiltration channel (e.g. attribute-selector + external
    background-image url()) has no network path out even with style-src
    relaxed.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'none';">
  <title>PageDown Pagination Render Context</title>
</head>
<body>
  <div id="content-root"></div>
  <script type="module" src="./index.js"></script>
</body>
</html>
